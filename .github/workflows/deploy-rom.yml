name: Build and Deploy pokemonHnS ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          apt-get update
          apt-get install -y libpng-dev curl jq

      - name: Build agbcc compiler
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ..
          cd ..

      - name: Compile pokemonHnS GBA ROM
        run: |
          make -j$(nproc) modern

      - name: Verify compiled ROM binary
        run: |
          if [ -f "pokemonHnS.gba" ]; then
            echo "SUCCESS: pokemonHnS.gba exists ($(stat -c%s pokemonHnS.gba) bytes)"
          elif [ -f "pokeemerald.gba" ]; then
            echo "Renaming pokeemerald.gba to pokemonHnS.gba"
            cp pokeemerald.gba pokemonHnS.gba
          else
            echo "ERROR: ROM binary not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemonHnS-rom
          path: pokemonHnS.gba

      - name: Deploy to Supabase Storage (roms bucket)
        run: |
          echo "Uploading pokemonHnS.gba to Supabase Storage..."
          # Usar SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY (o fallback a los valores del proyecto de Cyber-Johto)
          SB_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SB_URL" ]; then
            SB_URL="https://hywlytsbogbassecflbw.supabase.co"
          fi
          
          SB_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          if [ -z "$SB_KEY" ]; then
            SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5d2x5dHNib2diYXNzZWNmbGJ3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDM4MjY4MywiZXhwIjoyMDg5OTU4NjgzfQ.3xar2lr0GSK3TjKVPG-kyuN2_0uougk2EHsv52-lzc4"
          fi

          curl -f -X POST "${SB_URL}/storage/v1/object/roms/pokemonHnS.gba" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "apikey: ${SB_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary "@pokemonHnS.gba"
          echo "Deployment to Supabase Storage completed successfully!"
