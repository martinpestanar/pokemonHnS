name: Build and Deploy pokemonHnS ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          apt-get update
          apt-get install -y libpng-dev curl jq build-essential

      - name: Compile pokemonHnS GBA ROM (Modern GCC)
        run: |
          make modern -j$(nproc)
          ls -lh pokemonHnS.gba

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemonHnS-rom
          path: |
            pokemonHnS.gba
            pokemonHnS.elf
            pokemonHnS.map
