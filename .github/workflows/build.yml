name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libpng-dev build-essential

      - name: Build ROM (Modern GCC)
        run: |
          make modern -j$(nproc)

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonHnS
          path: "*.gba"
